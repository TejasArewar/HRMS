services:
  - type: web
    name: hrms-lite
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn HRMS.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hrms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false

databases:
  - name: hrms-db
    databaseName: hrms_ym49
    user: hrms_ym49_user